<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LearnTense</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  padding: 20px;
}

header {
  text-align: center;
  padding: 25px 10px;
}

.logo {
  font-size: 34px;
  font-weight: 800;
}

.subtitle {
  color: #667085;
  margin-top: 8px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  margin-top: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: #315efb;
  color: white;
}

button:active {
  transform: scale(.98);
}

.option {
  background: #f1f4f9;
  color: #172033;
  text-align: left;
}

.option:hover {
  background: #e6ebf5;
}

.correct {
  background: #d9f7df !important;
  color: #126b2f !important;
}

.wrong {
  background: #ffe0e0 !important;
  color: #9b1c1c !important;
}

.hidden {
  display: none;
}

.progress {
  color: #667085;
  font-size: 14px;
  margin-bottom: 15px;
}

.explanation {
  background: #f5f8ff;
  border-left: 4px solid #315efb;
  padding: 15px;
  margin-top: 18px;
  border-radius: 8px;
}

.score {
  font-size: 42px;
  font-weight: 800;
  text-align: center;
  margin: 20px 0;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #667085;
}

.error {
  color: #b42318;
  background: #fee4e2;
  padding: 15px;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">📚 LearnTense</div>
  <div class="subtitle">
    Learn English Tenses by practicing
  </div>
</header>

<!-- HOME -->

<section id="home" class="card">

  <h2>Simple Present</h2>

  <p>
    Learn how to talk about habits, routines,
    facts and things that happen regularly.
  </p>

  <button onclick="startQuiz()">
    Start Learning
  </button>

</section>


<!-- QUIZ -->

<section id="quiz" class="card hidden">

  <div id="progress" class="progress"></div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <div id="explanation"
       class="explanation hidden"></div>

  <button id="nextButton"
          class="hidden"
          onclick="nextQuestion()">
    Next Question
  </button>

</section>


<!-- RESULT -->

<section id="result" class="card hidden">

  <h2>🎉 Quiz Complete!</h2>

  <div id="score"
       class="score">
  </div>

  <p id="resultMessage"
     style="text-align:center">
  </p>

  <button onclick="restartQuiz()">
    Try Again
  </button>

</section>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://fvrwhvfgrzmlzxmgiiuk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_TrPG7148BZKVue1fwchLSw_5Ac747Yp";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// ---------------------------
// APP STATE
// ---------------------------

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let currentUser = null;


// ---------------------------
// START QUIZ
// ---------------------------

async function ensureUser() {

  const { data: sessionData } =
    await supabaseClient.auth.getSession();

  if (sessionData.session) {
    currentUser = sessionData.session.user;
    return true;
  }

  const { data, error } =
    await supabaseClient.auth.signInAnonymously();

  if (error) {
    console.error("Anonymous login error:", error);
    return false;
  }

  currentUser = data.user;

  return true;
}



async function startQuiz() {

  const loggedIn = await ensureUser();

  if (!loggedIn) {

    alert("Unable to start learner session.");

    return;
  }

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.remove("hidden");

  document.getElementById("quiz")
    .innerHTML = `
      <div class="loading">
        Loading questions...
      </div>
    `;

  await loadQuestions();
}


// ---------------------------
// LOAD QUESTIONS FROM SUPABASE
// ---------------------------

async function loadQuestions() {

  const { data, error } =
    await supabaseClient
      .from("questions")
      .select("*")
      .eq("active", true)
      .order("sort_order");

  if (error) {

    document.getElementById("quiz")
      .innerHTML = `
        <div class="error">
          Unable to load questions.<br><br>
          ${error.message}
        </div>
      `;

    return;
  }

  if (!data || data.length === 0) {

    document.getElementById("quiz")
      .innerHTML = `
        <div class="error">
          No questions found.
        </div>
      `;

    return;
  }

  questions = data;

  currentQuestion = 0;
  score = 0;

  showQuestion();
}


// ---------------------------
// SHOW QUESTION
// ---------------------------

function showQuestion() {

  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("quiz")
    .innerHTML = `

      <div id="progress"
           class="progress">
        Question ${currentQuestion + 1}
        of ${questions.length}
      </div>

      <h2 id="question">
        ${escapeHTML(q.question)}
      </h2>

      <div id="options"></div>

      <div id="explanation"
           class="explanation hidden">
      </div>

      <button id="nextButton"
              class="hidden"
              onclick="nextQuestion()">
        Next Question
      </button>
    `;

  const optionsContainer =
    document.getElementById("options");

  q.options.forEach((option, index) => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.textContent = option;

    button.onclick = () =>
      checkAnswer(index, button);

    optionsContainer.appendChild(button);
  });
}


// ---------------------------
// CHECK ANSWER
// ---------------------------

async function checkAnswer(selectedIndex, selectedButton) {

  if (answered) return;

  answered = true;

  const q = questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(button => {
    button.disabled = true;
  });

  if (selectedIndex === q.correct_index) {

  score++;

  selectedButton.classList.add("correct");

  await saveProgress(q.id, true);

} else {

  selectedButton.classList.add("wrong");

  await saveProgress(q.id, false);

    buttons[q.correct_index]
      .classList.add("correct");
  }

  const explanation =
    document.getElementById("explanation");

  explanation.textContent =
    "💡 " + q.explanation;

  explanation.classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.remove("hidden");
}


async function saveProgress(questionId, isCorrect) {

  if (!currentUser) return;

  const { data: existing, error: fetchError } =
    await supabaseClient
      .from("user_question_progress")
      .select("*")
      .eq("user_id", currentUser.id)
      .eq("question_id", questionId)
      .maybeSingle();

  if (fetchError) {
    console.error("Progress fetch error:", fetchError);
    return;
  }

  if (!existing) {

    const { error } =
      await supabaseClient
        .from("user_question_progress")
        .insert({
          user_id: currentUser.id,
          question_id: questionId,
          attempts: 1,
          mistakes: isCorrect ? 0 : 1,
          consecutive_correct: isCorrect ? 1 : 0,
          mastered: false,
          last_attempt: new Date().toISOString()
        });

    if (error) {
      console.error("Progress insert error:", error);
    }

    return;
  }

  const newAttempts =
    existing.attempts + 1;

  const newMistakes =
    existing.mistakes + (isCorrect ? 0 : 1);

  const newConsecutive =
    isCorrect
      ? existing.consecutive_correct + 1
      : 0;

  const mastered =
    newConsecutive >= 5;

  const { error } =
    await supabaseClient
      .from("user_question_progress")
      .update({
        attempts: newAttempts,
        mistakes: newMistakes,
        consecutive_correct: newConsecutive,
        mastered: mastered,
        last_attempt: new Date().toISOString()
      })
      .eq("id", existing.id);

  if (error) {
    console.error("Progress update error:", error);
  }
}

// ---------------------------
// NEXT QUESTION
// ---------------------------

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion >= questions.length) {

    showResult();

  } else {

    showQuestion();
  }
}


// ---------------------------
// RESULT
// ---------------------------

function showResult() {

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.remove("hidden");

  const percentage =
    Math.round(
      (score / questions.length) * 100
    );

  document.getElementById("score")
    .textContent =
    `${score}/${questions.length} (${percentage}%)`;

  let message;

  if (percentage >= 90) {
    message =
      "Excellent! You have a strong understanding of the Simple Present.";
  }
  else if (percentage >= 70) {
    message =
      "Good job! A little more practice will make you stronger.";
  }
  else if (percentage >= 50) {
    message =
      "You're getting there. Let's practice the difficult questions again.";
  }
  else {
    message =
      "Let's learn the rules and practice again.";
  }

  document.getElementById("resultMessage")
    .textContent = message;
}


// ---------------------------
// RESTART
// ---------------------------

function restartQuiz() {

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("home")
    .classList.remove("hidden");

}


// ---------------------------
// SECURITY / DISPLAY HELPER
// ---------------------------

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
