<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LearnTense</title>

<style>

/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.app {
  width: 100%;
  max-width: 600px;
  min-height: 100vh;
  margin: auto;
  padding: 20px;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;

  font-size: 16px;
  font-weight: 700;

  cursor: pointer;

  background: #315efb;
  color: white;

  transition:
    transform 0.15s ease,
    background 0.15s ease,
    opacity 0.15s ease;
}

button:active {
  transform: scale(.98);
}

button:disabled {
  cursor: not-allowed;
}


/* =====================================================
   HEADER
===================================================== */

header {
  text-align: center;
  padding: 25px 10px;
}

.logo {
  font-size: 34px;
  font-weight: 800;
}

.subtitle {
  color: #667085;
  margin-top: 8px;
}


/* =====================================================
   CARD
===================================================== */

.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  margin-top: 18px;

  box-shadow:
    0 5px 20px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
}


/* =====================================================
   GENERAL
===================================================== */

.hidden {
  display: none;
}

.progress {
  color: #667085;
  font-size: 14px;
  margin-bottom: 15px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #667085;
}

.error {
  color: #b42318;
  background: #fee4e2;
  padding: 15px;
  border-radius: 10px;
  line-height: 1.5;
}

.explanation {
  background: #f5f8ff;

  border-left: 4px solid #315efb;

  padding: 15px;
  margin-top: 18px;

  border-radius: 8px;

  line-height: 1.6;
}


/* =====================================================
   LESSON HEADER
===================================================== */

.lesson-header {
  text-align: center;
  margin-bottom: 20px;
}

.lesson-emoji {
  font-size: 48px;
  margin-bottom: 8px;
}

.lesson-title {
  font-size: 27px;
  line-height: 1.25;
  margin-bottom: 18px;
}


/* =====================================================
   LESSON PROGRESS BAR
===================================================== */

.progress-bar {
  height: 8px;

  background: #e5e7eb;

  border-radius: 20px;

  overflow: hidden;

  margin-top: 10px;
}

.progress-fill {
  height: 100%;

  background: #315efb;

  border-radius: 20px;

  transition:
    width .3s ease;
}


/* =====================================================
   LESSON CONTENT
===================================================== */

.lesson-content {
  font-size: 17px;
  line-height: 1.65;

  margin-bottom: 20px;
}


/*
   Each lesson point becomes a separate block.
   This prevents "\n" from appearing on screen.
*/

.lesson-point {
  position: relative;

  background: #f8fafc;

  border-radius: 12px;

  padding: 12px 14px 12px 40px;

  margin: 10px 0;

  border: 1px solid #e5e7eb;
}

.lesson-point::before {
  content: "•";

  position: absolute;

  left: 16px;
  top: 10px;

  font-size: 24px;
  font-weight: 800;

  color: #315efb;
}


/* =====================================================
   RULE CARD
===================================================== */

.rule-card {
  background: #fff7d6;

  border-radius: 16px;

  padding: 18px;

  margin: 20px 0;

  border: 1px solid #f2df91;
}

.rule-title {
  font-size: 17px;
  font-weight: 800;

  margin-bottom: 8px;
}

.rule-text {
  font-size: 16px;
  line-height: 1.6;
}


/* =====================================================
   EXAMPLES
===================================================== */

.example-card {
  background: #f7f9fc;

  border-radius: 14px;

  padding: 15px;

  margin: 12px 0;

  border: 1px solid #e5e7eb;
}

.example-label {
  font-size: 14px;
  font-weight: 800;

  margin-bottom: 7px;
}

.example-text {
  font-size: 17px;
  line-height: 1.5;
}

.wrong-example {
  background: #fff0f0;

  border-color: #f3b4b4;
}


/* =====================================================
   QUICK CHECK
===================================================== */

.mini-check {
  background: #eef4ff;

  border-radius: 18px;

  padding: 20px;

  margin-top: 26px;

  border: 1px solid #d9e5ff;
}

.mini-check-title {
  font-size: 20px;
  font-weight: 800;

  margin-bottom: 16px;
}

.mini-question {
  background: white;

  border-radius: 14px;

  padding: 16px;

  font-size: 19px;
  font-weight: 700;

  line-height: 1.6;

  margin-bottom: 14px;

  border: 1px solid #e5e7eb;
}


/* =====================================================
   QUICK CHECK OPTIONS
===================================================== */

.mini-option {
  position: relative;

  width: 100%;

  background: white;
  color: #172033;

  border: 2px solid #cbd5e1;

  border-radius: 14px;

  padding: 15px 16px 15px 50px;

  margin-top: 12px;

  text-align: left;

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;

  transition:
    transform 0.15s ease,
    border-color 0.15s ease,
    background 0.15s ease,
    box-shadow 0.15s ease;
}


/* clickable bullet */

.mini-option::before {
  content: "○";

  position: absolute;

  left: 17px;
  top: 50%;

  transform: translateY(-50%);

  font-size: 25px;

  font-weight: 400;

  color: #667085;
}

.mini-option:hover {
  border-color: #315efb;

  background: #f5f8ff;

  transform: translateY(-1px);

  box-shadow:
    0 3px 8px rgba(49,94,251,0.12);
}


/* Quick Check correct */

.mini-option.correct {
  background: #d9f7df !important;

  color: #126b2f !important;

  border-color: #42a85f !important;
}

.mini-option.correct::before {
  content: "✓";

  font-weight: 800;

  color: #126b2f;
}


/* Quick Check wrong */

.mini-option.wrong {
  background: #ffe0e0 !important;

  color: #9b1c1c !important;

  border-color: #e26b6b !important;
}

.mini-option.wrong::before {
  content: "✕";

  font-weight: 800;

  color: #9b1c1c;
}


/* =====================================================
   QUICK CHECK FEEDBACK
===================================================== */

.mini-feedback {
  margin-top: 16px;

  padding: 15px;

  background: white;

  border-radius: 14px;

  line-height: 1.6;

  font-size: 16px;

  border: 1px solid #e5e7eb;
}


/* =====================================================
   LESSON NAVIGATION
===================================================== */

.lesson-navigation {
  display: flex;

  gap: 12px;

  margin-top: 22px;
}

.lesson-navigation button {
  margin-top: 0;
}

.back-button {
  flex: 0 0 32%;

  background: #eef1f6;

  color: #172033;

  border: 1px solid #d8dee8;
}

.back-button:hover {
  background: #e2e7ef;
}

.continue-button {
  flex: 1;
}


/* disabled Continue */

.continue-button:disabled {
  opacity: 0.45;

  cursor: not-allowed;
}


/* enabled Continue */

.continue-button.ready {
  opacity: 1;

  cursor: pointer;
}


/* =====================================================
   MAIN QUIZ OPTIONS
===================================================== */

.option {
  position: relative;

  width: 100%;

  background: #f8fafc;

  color: #172033;

  text-align: left;

  border: 2px solid #cbd5e1;

  border-radius: 14px;

  padding: 15px 16px 15px 50px;

  margin-top: 12px;

  font-size: 17px;
  font-weight: 700;

  cursor: pointer;
}

.option::before {
  content: "○";

  position: absolute;

  left: 17px;
  top: 50%;

  transform: translateY(-50%);

  font-size: 25px;

  color: #667085;
}

.option:hover {
  background: #f5f8ff;

  border-color: #315efb;
}


/* Main quiz correct */

.option.correct {
  background: #d9f7df !important;

  color: #126b2f !important;

  border-color: #42a85f !important;
}

.option.correct::before {
  content: "✓";

  color: #126b2f;

  font-weight: 800;
}


/* Main quiz wrong */

.option.wrong {
  background: #ffe0e0 !important;

  color: #9b1c1c !important;

  border-color: #e26b6b !important;
}

.option.wrong::before {
  content: "✕";

  color: #9b1c1c;

  font-weight: 800;
}


/* =====================================================
   RESULT
===================================================== */

.score {
  font-size: 42px;

  font-weight: 800;

  text-align: center;

  margin: 20px 0;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

  .app {
    padding: 14px;
  }

  .card {
    padding: 20px;
  }

  .logo {
    font-size: 30px;
  }

  .lesson-title {
    font-size: 25px;
  }

  .mini-question {
    font-size: 18px;
  }

  .mini-option,
  .option {
    min-height: 54px;

    font-size: 17px;
  }

  .lesson-navigation {
    gap: 8px;
  }

  .back-button {
    flex: 0 0 30%;
  }

}

</style>
</head>


<body>

<div class="app">

<header>

  <div class="logo">
    📚 LearnTense
  </div>

  <div class="subtitle">
    Learn English Tenses by practicing
  </div>

</header>


<!-- ===================================================
     HOME
=================================================== -->

<section id="home" class="card">

  <h2>
    Simple Present
  </h2>

  <p>
    Learn how to talk about habits, routines,
    facts and things that happen regularly.
  </p>

  <button onclick="startQuiz()">
    🚀 Start Learning
  </button>

</section>


<!-- ===================================================
     QUIZ / LESSON AREA
=================================================== -->

<section id="quiz" class="card hidden">

  <div id="progress"
       class="progress">
  </div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <div id="explanation"
       class="explanation hidden">
  </div>

  <button id="nextButton"
          class="hidden"
          onclick="nextQuestion()">
    Next Question
  </button>

</section>


<!-- ===================================================
     RESULT
=================================================== -->

<section id="result" class="card hidden">

  <h2>
    🎉 Quiz Complete!
  </h2>

  <div id="score"
       class="score">
  </div>

  <p id="resultMessage"
     style="text-align:center">
  </p>

  <button onclick="restartQuiz()">
    🔄 Try Again
  </button>

</section>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://fvrwhvfgrzmlzxmgiiuk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_TrPG7148BZKVue1fwchLSw_5Ac747Yp";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =====================================================
   APP STATE
===================================================== */

let questions = [];

let currentQuestion = 0;

let score = 0;

let answered = false;

let currentUser = null;

let lessons = [];

let currentLesson = 0;


/* =====================================================
   USER SESSION
===================================================== */

async function ensureUser() {

  const {
    data: sessionData
  } =
    await supabaseClient.auth.getSession();


  if (sessionData.session) {

    currentUser =
      sessionData.session.user;

    return true;
  }


  const {
    data,
    error
  } =
    await supabaseClient.auth
      .signInAnonymously();


  if (error) {

    console.error(
      "Anonymous login error:",
      error
    );

    return false;
  }


  currentUser =
    data.user;

  return true;
}


/* =====================================================
   START LEARNING
===================================================== */

async function startQuiz() {

  const loggedIn =
    await ensureUser();


  if (!loggedIn) {

    alert(
      "Unable to start learner session."
    );

    return;
  }


  document.getElementById("home")
    .classList.add("hidden");


  document.getElementById("result")
    .classList.add("hidden");


  document.getElementById("quiz")
    .classList.remove("hidden");


  document.getElementById("quiz")
    .innerHTML = `

      <div class="loading">

        📚 Loading lesson...

      </div>

    `;


  await loadLesson();
}


/* =====================================================
   LOAD LESSONS
===================================================== */

async function loadLesson() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("tense_lessons")
      .select("*")
      .eq("tense_id", 1)
      .eq("active", true)
      .order("sort_order");


  if (error) {

    console.error(error);


    document.getElementById("quiz")
      .innerHTML = `

        <div class="error">

          Unable to load lesson.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

    return;
  }


  if (!data || data.length === 0) {

    await loadQuestions();

    return;
  }


  lessons = data;

  currentLesson = 0;

  showLesson();
}


/* =====================================================
   SHOW LESSON
===================================================== */

function showLesson() {

  const lesson =
    lessons[currentLesson];


  /* ---------------------------------------------
     EXAMPLES
  --------------------------------------------- */

  const examples =
    Array.isArray(lesson.examples)
      ? lesson.examples
      : [];


  let examplesHTML = "";


  examples.forEach(example => {

    const isWrong =
      String(
        example.label || ""
      ).includes("❌");


    examplesHTML += `

      <div class="example-card
                  ${isWrong
                    ? "wrong-example"
                    : ""}">

        <div class="example-label">

          ${escapeHTML(
            example.label || ""
          )}

        </div>

        <div class="example-text">

          ${escapeHTML(
            example.text || ""
          )}

        </div>

      </div>

    `;

  });


  /* ---------------------------------------------
     QUICK CHECK
  --------------------------------------------- */

  const hasQuickCheck =
    Boolean(
      lesson.check_question
    );


  let quickCheckHTML = "";


  if (hasQuickCheck) {

    quickCheckHTML = `

      <div class="mini-check">

        <div class="mini-check-title">

          🧩 Quick Check

        </div>


        <div class="mini-question">

          ${formatInlineText(
            lesson.check_question
          )}

        </div>


        <div id="mini-options">

        </div>


        <div
          id="mini-feedback"
          class="mini-feedback hidden">
        </div>

      </div>

    `;
  }


  /* ---------------------------------------------
     NAVIGATION
  --------------------------------------------- */

  const isFirstLesson =
    currentLesson === 0;


  const isLastLesson =
    currentLesson ===
    lessons.length - 1;


  const buttonText =
    isLastLesson
      ? "🚀 Start Practice"
      : "Continue →";


  const buttonAction =
    isLastLesson
      ? "startPractice()"
      : "nextLesson()";


  /* ---------------------------------------------
     LESSON HTML
  --------------------------------------------- */

  document.getElementById("quiz")
    .innerHTML = `

      <div class="lesson-header">

        <div class="lesson-emoji">

          ${escapeHTML(
            lesson.emoji || "📚"
          )}

        </div>


        <div class="progress">

          📖 Lesson
          ${currentLesson + 1}
          of
          ${lessons.length}

        </div>


        <div class="progress-bar">

          <div
            class="progress-fill"
            style="width:${
              ((currentLesson + 1) /
              lessons.length) * 100
            }%">
          </div>

        </div>

      </div>


      <h2 class="lesson-title">

        ${escapeHTML(
          lesson.title || ""
        )}

      </h2>


      <div class="lesson-content">

        ${formatLessonContent(
          lesson.content
        )}

      </div>


      ${
        lesson.key_rule
        ? `

          <div class="rule-card">

            <div class="rule-title">

              ⭐ Remember

            </div>

            <div class="rule-text">

              ${formatLessonContent(
                lesson.key_rule
              )}

            </div>

          </div>

        `
        : ""
      }


      ${
        examplesHTML
          ? `

            <div class="examples">

              ${examplesHTML}

            </div>

          `
          : ""
      }


      ${quickCheckHTML}


      <div class="lesson-navigation">

        ${
          !isFirstLesson
          ? `

            <button
              class="back-button"
              onclick="previousLesson()">

              ← Back

            </button>

          `
          : ""
        }


        <button
          id="lessonContinueButton"
          class="continue-button"
          ${hasQuickCheck
            ? "disabled"
            : ""}
          onclick="${buttonAction}">

          ${buttonText}

        </button>

      </div>

    `;


  /* ---------------------------------------------
     QUICK CHECK OPTIONS
  --------------------------------------------- */

  if (hasQuickCheck) {

    createQuickCheckOptions(
      lesson
    );

  }

}


/* =====================================================
   CREATE QUICK CHECK OPTIONS
===================================================== */

function createQuickCheckOptions(
  lesson
) {

  const container =
    document.getElementById(
      "mini-options"
    );


  if (!container) return;


  let options = [];


  if (
    Array.isArray(
      lesson.check_options
    )
  ) {

    options =
      lesson.check_options;

  }

  else {

    try {

      options =
        JSON.parse(
          lesson.check_options
        );

    }

    catch (error) {

      console.error(
        "Quick check options error:",
        error
      );

      return;
    }

  }


  options.forEach(
    (option, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "mini-option";


      button.textContent =
        option;


      button.onclick = () => {

        answerMiniCheck(
          index,
          button
        );

      };


      container.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   QUICK CHECK ANSWER
===================================================== */

function answerMiniCheck(
  selectedIndex,
  selectedButton
) {

  const lesson =
    lessons[currentLesson];


  const buttons =
    document.querySelectorAll(
      "#mini-options .mini-option"
    );


  /* Prevent second answer */

  buttons.forEach(button => {

    button.disabled = true;

  });


  const feedback =
    document.getElementById(
      "mini-feedback"
    );


  const continueButton =
    document.getElementById(
      "lessonContinueButton"
    );


  const isCorrect =
    selectedIndex ===
    Number(
      lesson.check_correct_index
    );


  /* ---------------------------------------------
     CORRECT
  --------------------------------------------- */

  if (isCorrect) {

    selectedButton
      .classList.add(
        "correct"
      );


    feedback.innerHTML = `

      🎉 <strong>Correct!</strong>

      <br><br>

      ${escapeHTML(
        lesson.check_explanation ||
        "Great job!"
      )}

    `;

  }


  /* ---------------------------------------------
     WRONG
  --------------------------------------------- */

  else {

    selectedButton
      .classList.add(
        "wrong"
      );


    const correctButton =
      buttons[
        Number(
          lesson.check_correct_index
        )
      ];


    if (correctButton) {

      correctButton
        .classList.add(
          "correct"
        );

    }


    feedback.innerHTML = `

      💡 <strong>Let's learn this!</strong>

      <br><br>

      ${escapeHTML(
        lesson.check_explanation ||
        "Review the rule and try again."
      )}

    `;

  }


  feedback.classList.remove(
    "hidden"
  );


  /* ---------------------------------------------
     ENABLE CONTINUE
  --------------------------------------------- */

  if (continueButton) {

    continueButton.disabled =
      false;

    continueButton.classList.add(
      "ready"
    );

  }

}


/* =====================================================
   NEXT LESSON
===================================================== */

function nextLesson() {

  if (
    currentLesson >=
    lessons.length - 1
  ) {

    startPractice();

    return;
  }


  currentLesson++;

  showLesson();
}


/* =====================================================
   PREVIOUS LESSON
===================================================== */

function previousLesson() {

  if (
    currentLesson <= 0
  ) {

    return;
  }


  currentLesson--;

  showLesson();
}


/* =====================================================
   START PRACTICE
===================================================== */

async function startPractice() {

  document.getElementById("quiz")
    .innerHTML = `

      <div class="loading">

        🧠 Preparing your
        practice questions...

      </div>

    `;


  await loadQuestions();
}


/* =====================================================
   LOAD SMART QUESTIONS
===================================================== */

async function loadQuestions() {

  const SIMPLE_PRESENT_ID =
    1;


  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "get_learning_questions",
      {
        p_user_id:
          currentUser.id,

        p_tense_id:
          SIMPLE_PRESENT_ID,

        p_limit:
          10
      }
    );


  if (error) {

    console.error(error);


    document.getElementById("quiz")
      .innerHTML = `

        <div class="error">

          Unable to load
          learning questions.

          <br><br>

          ${escapeHTML(
            error.message
          )}

        </div>

      `;

    return;
  }


  if (
    !data ||
    data.length === 0
  ) {

    document.getElementById("quiz")
      .innerHTML = `

        <div>

          <h2>
            🎉 Amazing!
          </h2>

          <p>
            You have mastered all the
            available Simple Present
            questions.
          </p>

        </div>

      `;

    return;
  }


  questions = data;

  currentQuestion = 0;

  score = 0;

  showQuestion();
}


/* =====================================================
   SHOW QUESTION
===================================================== */

function showQuestion() {

  answered = false;


  const q =
    questions[
      currentQuestion
    ];


  document.getElementById("quiz")
    .innerHTML = `

      <div class="progress">

        🧠 Question
        ${currentQuestion + 1}
        of
        ${questions.length}

      </div>


      <h2 id="question">

        ${escapeHTML(
          q.question
        )}

      </h2>


      <div id="options">

      </div>


      <div
        id="explanation"
        class="explanation hidden">
      </div>


      <button
        id="nextButton"
        class="hidden"
        onclick="nextQuestion()">

        Next Question →

      </button>

    `;


  const optionsContainer =
    document.getElementById(
      "options"
    );


  if (
    !Array.isArray(
      q.options
    )
  ) {

    console.error(
      "Question options are invalid:",
      q
    );

    return;
  }


  q.options.forEach(
    (option, index) => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "option";


      button.textContent =
        option;


      button.onclick = () => {

        checkAnswer(
          index,
          button
        );

      };


      optionsContainer.appendChild(
        button
      );

    }
  );

}


/* =====================================================
   CHECK MAIN QUIZ ANSWER
===================================================== */

async function checkAnswer(
  selectedIndex,
  selectedButton
) {

  if (answered) return;


  answered = true;


  const q =
    questions[
      currentQuestion
    ];


  const buttons =
    document.querySelectorAll(
      "#options .option"
    );


  buttons.forEach(button => {

    button.disabled = true;

  });


  const correctIndex =
    Number(
      q.correct_index
    );


  /* CORRECT */

  if (
    selectedIndex ===
    correctIndex
  ) {

    score++;


    selectedButton
      .classList.add(
        "correct"
      );


    await saveProgress(
      q.id,
      true
    );

  }


  /* WRONG */

  else {

    selectedButton
      .classList.add(
        "wrong"
      );


    await saveProgress(
      q.id,
      false
    );


    if (
      buttons[
        correctIndex
      ]
    ) {

      buttons[
        correctIndex
      ].classList.add(
        "correct"
      );

    }

  }


  const explanation =
    document.getElementById(
      "explanation"
    );


  explanation.textContent =
    "💡 " +
    (
      q.explanation ||
      "Review the rule."
    );


  explanation.classList.remove(
    "hidden"
  );


  document.getElementById(
    "nextButton"
  ).classList.remove(
    "hidden"
  );

}


/* =====================================================
   SAVE PROGRESS
===================================================== */

async function saveProgress(
  questionId,
  isCorrect
) {

  if (!currentUser) return;


  const {
    data: existing,
    error: fetchError
  } =
    await supabaseClient
      .from(
        "user_question_progress"
      )
      .select("*")
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "question_id",
        questionId
      )
      .maybeSingle();


  if (fetchError) {

    console.error(
      "Progress fetch error:",
      fetchError
    );

    return;
  }


  /* ---------------------------------------------
     FIRST ATTEMPT
  --------------------------------------------- */

  if (!existing) {

    const {
      error
    } =
      await supabaseClient
        .from(
          "user_question_progress"
        )
        .insert({

          user_id:
            currentUser.id,

          question_id:
            questionId,

          attempts:
            1,

          mistakes:
            isCorrect
              ? 0
              : 1,

          consecutive_correct:
            isCorrect
              ? 1
              : 0,

          mastered:
            false,

          last_attempt:
            new Date()
              .toISOString()

        });


    if (error) {

      console.error(
        "Progress insert error:",
        error
      );

    }


    return;
  }


  /* ---------------------------------------------
     UPDATE PROGRESS
  --------------------------------------------- */

  const newAttempts =
    existing.attempts + 1;


  const newMistakes =
    existing.mistakes +
    (
      isCorrect
        ? 0
        : 1
    );


  const newConsecutive =
    isCorrect

      ? existing.consecutive_correct + 1

      : 0;


  const mastered =
    newConsecutive >= 5;


  const {
    error
  } =
    await supabaseClient
      .from(
        "user_question_progress"
      )
      .update({

        attempts:
          newAttempts,

        mistakes:
          newMistakes,

        consecutive_correct:
          newConsecutive,

        mastered:
          mastered,

        last_attempt:
          new Date()
            .toISOString()

      })
      .eq(
        "id",
        existing.id
      );


  if (error) {

    console.error(
      "Progress update error:",
      error
    );

  }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

  currentQuestion++;


  if (
    currentQuestion >=
    questions.length
  ) {

    showResult();

    return;
  }


  showQuestion();
}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

  document.getElementById("quiz")
    .classList.add(
      "hidden"
    );


  document.getElementById("result")
    .classList.remove(
      "hidden"
    );


  const percentage =
    questions.length
      ? Math.round(
          (
            score /
            questions.length
          ) * 100
        )
      : 0;


  document.getElementById(
    "score"
  ).textContent =

    `${score}/${questions.length}
     (${percentage}%)`;


  let message;


  if (percentage >= 90) {

    message =
      "🌟 Excellent! You have a strong understanding of the Simple Present.";

  }

  else if (percentage >= 70) {

    message =
      "👍 Good job! A little more practice will make you stronger.";

  }

  else if (percentage >= 50) {

    message =
      "💪 You're getting there. Let's practice the difficult questions again.";

  }

  else {

    message =
      "📚 Let's review the rules and practice again.";

  }


  document.getElementById(
    "resultMessage"
  ).textContent =
    message;
}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

  document.getElementById(
    "result"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "quiz"
  ).classList.add(
    "hidden"
  );


  document.getElementById(
    "home"
  ).classList.remove(
    "hidden"
  );

}


/* =====================================================
   LESSON CONTENT FORMATTER
===================================================== */

/*
   Handles BOTH:

   1. Real newline:
      Habit: I brush...

      Routine: She goes...

   2. Literal "\n":
      Habit: I brush...\nRoutine: She goes...

   Each line becomes a visual bullet.
*/

function formatLessonContent(
  text
) {

  if (!text) {
    return "";
  }


  let cleanText =
    String(text);


  /*
     Convert literal \n
     into real newlines.
  */

  cleanText =
    cleanText.replace(
      /\\n/g,
      "\n"
    );


  /*
     Split into lines.
  */

  const lines =
    cleanText
      .split(/\r?\n/)
      .map(
        line => line.trim()
      )
      .filter(
        line => line.length > 0
      );


  /*
     If there is only one line,
     display normally.
  */

  if (lines.length <= 1) {

    return `
      <div class="lesson-point">

        ${escapeHTML(
          lines[0] || ""
        )}

      </div>
    `;

  }


  /*
     Multiple lines become
     separate bullet cards.
  */

  return lines
    .map(line => `

      <div class="lesson-point">

        ${escapeHTML(line)}

      </div>

    `)
    .join("");

}


/* =====================================================
   INLINE TEXT
===================================================== */

/*
   Used for Quick Check questions
   where we don't want every sentence
   turned into a separate bullet.
*/

function formatInlineText(
  text
) {

  if (!text) return "";


  return escapeHTML(
    String(text)
      .replace(
        /\\n/g,
        "\n"
      )
  ).replace(
    /\n/g,
    "<br>"
  );

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHTML(
  text
) {

  const div =
    document.createElement(
      "div"
    );


  div.textContent =
    text == null
      ? ""
      : String(text);


  return div.innerHTML;
}
