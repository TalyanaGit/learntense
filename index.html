<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>LearnTense</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #172033;
}

.app {
  max-width: 600px;
  margin: auto;
  min-height: 100vh;
  padding: 20px;
}

header {
  text-align: center;
  padding: 25px 10px;
}

.logo {
  font-size: 34px;
  font-weight: 800;
}

.subtitle {
  color: #667085;
  margin-top: 8px;
}

.card {
  background: white;
  border-radius: 20px;
  padding: 24px;
  margin-top: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.07);
}

h2 {
  margin-top: 0;
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  background: #315efb;
  color: white;
}

button:active {
  transform: scale(.98);
}

.option {
  background: #f1f4f9;
  color: #172033;
  text-align: left;
}

.option:hover {
  background: #e6ebf5;
}

.correct {
  background: #d9f7df !important;
  color: #126b2f !important;
}

.wrong {
  background: #ffe0e0 !important;
  color: #9b1c1c !important;
}

.hidden {
  display: none;
}

.progress {
  color: #667085;
  font-size: 14px;
  margin-bottom: 15px;
}

.explanation {
  background: #f5f8ff;
  border-left: 4px solid #315efb;
  padding: 15px;
  margin-top: 18px;
  border-radius: 8px;
}

.score {
  font-size: 42px;
  font-weight: 800;
  text-align: center;
  margin: 20px 0;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #667085;
}

.error {
  color: #b42318;
  background: #fee4e2;
  padding: 15px;
  border-radius: 10px;
}

.lesson-header {
  text-align: center;
  margin-bottom: 20px;
}

.lesson-emoji {
  font-size: 48px;
  margin-bottom: 8px;
}

.progress-bar {
  height: 8px;
  background: #e5e7eb;
  border-radius: 20px;
  overflow: hidden;
  margin-top: 10px;
}

.progress-fill {
  height: 100%;
  background: #315efb;
  border-radius: 20px;
  transition: width .3s ease;
}

.lesson-title {
  font-size: 27px;
  line-height: 1.25;
  margin-bottom: 18px;
}

.lesson-content {
  font-size: 17px;
  line-height: 1.8;
  white-space: pre-line;
  margin-bottom: 20px;
}

.rule-card {
  background: #fff7d6;
  border-radius: 16px;
  padding: 18px;
  margin: 20px 0;
}

.rule-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 8px;
}

.rule-text {
  font-size: 16px;
  line-height: 1.6;
}

.example-card {
  background: #f7f9fc;
  border-radius: 14px;
  padding: 15px;
  margin: 12px 0;
}

.example-label {
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 7px;
}

.example-text {
  font-size: 17px;
  line-height: 1.5;
}

.wrong-example {
  background: #fff0f0;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">📚 LearnTense</div>
  <div class="subtitle">
    Learn English Tenses by practicing
  </div>
</header>

<!-- HOME -->

<section id="home" class="card">

  <h2>Simple Present</h2>

  <p>
    Learn how to talk about habits, routines,
    facts and things that happen regularly.
  </p>

  <button onclick="startQuiz()">
    Start Learning
  </button>

</section>


<!-- QUIZ -->

<section id="quiz" class="card hidden">

  <div id="progress" class="progress"></div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <div id="explanation"
       class="explanation hidden"></div>

  <button id="nextButton"
          class="hidden"
          onclick="nextQuestion()">
    Next Question
  </button>

</section>


<!-- RESULT -->

<section id="result" class="card hidden">

  <h2>🎉 Quiz Complete!</h2>

  <div id="score"
       class="score">
  </div>

  <p id="resultMessage"
     style="text-align:center">
  </p>

  <button onclick="restartQuiz()">
    Try Again
  </button>

</section>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://fvrwhvfgrzmlzxmgiiuk.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_TrPG7148BZKVue1fwchLSw_5Ac747Yp";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// ---------------------------
// APP STATE
// ---------------------------

let questions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;
let currentUser = null;
let lessons = [];
let currentLesson = 0;


// ---------------------------
// START QUIZ
// ---------------------------

async function ensureUser() {

  const { data: sessionData } =
    await supabaseClient.auth.getSession();

  if (sessionData.session) {
    currentUser = sessionData.session.user;
    return true;
  }

  const { data, error } =
    await supabaseClient.auth.signInAnonymously();

  if (error) {
    console.error("Anonymous login error:", error);
    return false;
  }

  currentUser = data.user;

  return true;
}


async function startQuiz() {

  const loggedIn = await ensureUser();

  if (!loggedIn) {
    alert("Unable to start learner session.");
    return;
  }

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("quiz")
    .classList.remove("hidden");

  document.getElementById("quiz").innerHTML = `
    <div class="loading">
      Loading lesson...
    </div>
  `;

  await loadLesson();
}


// ---------------------------
// LOAD QUESTIONS FROM SUPABASE
// ---------------------------

async function loadLesson() {

  const { data, error } =
    await supabaseClient
      .from("tense_lessons")
      .select("*")
      .eq("tense_id", 1)
      .eq("active", true)
      .order("sort_order");

  if (error) {

    console.error(error);

    document.getElementById("quiz").innerHTML = `
      <div class="error">
        Unable to load lesson.<br><br>
        ${error.message}
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    await loadQuestions();
    return;

  }

  lessons = data;
  currentLesson = 0;

  showLesson();
}

function showLesson() {

  const lesson = lessons[currentLesson];

  const examples =
    Array.isArray(lesson.examples)
      ? lesson.examples
      : [];

  let examplesHTML = "";

  examples.forEach(example => {

    const isWrong =
      example.label.includes("❌");

    examplesHTML += `
      <div class="example-card ${isWrong ? "wrong-example" : ""}">
        <div class="example-label">
          ${escapeHTML(example.label)}
        </div>

        <div class="example-text">
          ${escapeHTML(example.text)}
        </div>
      </div>
    `;
  });

  document.getElementById("quiz").innerHTML = `

    <div class="lesson-header">

      <div class="lesson-emoji">
        ${escapeHTML(lesson.emoji || "📚")}
      </div>

      <div class="progress">
        Lesson ${currentLesson + 1}
        of ${lessons.length}
      </div>

      <div class="progress-bar">
        <div
          class="progress-fill"
          style="width:${
            ((currentLesson + 1) /
            lessons.length) * 100
          }%">
        </div>
      </div>

    </div>

    <h2 class="lesson-title">
      ${escapeHTML(lesson.title)}
    </h2>

    <div class="lesson-content">
      ${escapeHTML(lesson.content)}
    </div>

    ${
      lesson.key_rule
      ? `
        <div class="rule-card">
          <div class="rule-title">
            ⭐ Remember
          </div>

          <div class="rule-text">
            ${escapeHTML(lesson.key_rule)}
          </div>
        </div>
      `
      : ""
    }

    ${
      examplesHTML
        ? `
          <div class="examples">
            ${examplesHTML}
          </div>
        `
        : ""
    }

    ${
      currentLesson < lessons.length - 1

      ? `
        <button onclick="nextLesson()">
          Continue →
        </button>
      `

      : `
        <button onclick="startPractice()">
          🚀 Start Practice
        </button>
      `
    }

  `;
}

function nextLesson() {

  currentLesson++;

  if (currentLesson >= lessons.length) {

    startPractice();

    return;
  }

  showLesson();
}

async function startPractice() {

  document.getElementById("quiz").innerHTML = `
    <div class="loading">
      Preparing your practice questions...
    </div>
  `;

  await loadQuestions();
}



async function loadQuestions() {

  const SIMPLE_PRESENT_ID =
    1; // We will verify this below

  const { data, error } =
    await supabaseClient.rpc(
      "get_learning_questions",
      {
        p_user_id: currentUser.id,
        p_tense_id: SIMPLE_PRESENT_ID,
        p_limit: 10
      }
    );

  if (error) {

    console.error(error);

    document.getElementById("quiz").innerHTML = `
      <div class="error">
        Unable to load learning questions.<br><br>
        ${error.message}
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    document.getElementById("quiz").innerHTML = `
      <div class="card">
        <h2>🎉 Amazing!</h2>
        <p>
          You have mastered all the available
          Simple Present questions.
        </p>
      </div>
    `;

    return;
  }

  questions = data;

  currentQuestion = 0;
  score = 0;

  showQuestion();
}


// ---------------------------
// SHOW QUESTION
// ---------------------------

function showQuestion() {

  answered = false;

  const q = questions[currentQuestion];

  document.getElementById("quiz")
    .innerHTML = `

      <div id="progress"
           class="progress">
        Question ${currentQuestion + 1}
        of ${questions.length}
      </div>

      <h2 id="question">
        ${escapeHTML(q.question)}
      </h2>

      <div id="options"></div>

      <div id="explanation"
           class="explanation hidden">
      </div>

      <button id="nextButton"
              class="hidden"
              onclick="nextQuestion()">
        Next Question
      </button>
    `;

  const optionsContainer =
    document.getElementById("options");

  q.options.forEach((option, index) => {

    const button =
      document.createElement("button");

    button.className = "option";

    button.textContent = option;

    button.onclick = () =>
      checkAnswer(index, button);

    optionsContainer.appendChild(button);
  });
}


// ---------------------------
// CHECK ANSWER
// ---------------------------

async function checkAnswer(selectedIndex, selectedButton) {

  if (answered) return;

  answered = true;

  const q = questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach(button => {
    button.disabled = true;
  });

  if (selectedIndex === q.correct_index) {

  score++;

  selectedButton.classList.add("correct");

  await saveProgress(q.id, true);

} else {

  selectedButton.classList.add("wrong");

  await saveProgress(q.id, false);

    buttons[q.correct_index]
      .classList.add("correct");
  }

  const explanation =
    document.getElementById("explanation");

  explanation.textContent =
    "💡 " + q.explanation;

  explanation.classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.remove("hidden");
}


async function saveProgress(questionId, isCorrect) {

  if (!currentUser) return;

  const { data: existing, error: fetchError } =
    await supabaseClient
      .from("user_question_progress")
      .select("*")
      .eq("user_id", currentUser.id)
      .eq("question_id", questionId)
      .maybeSingle();

  if (fetchError) {
    console.error("Progress fetch error:", fetchError);
    return;
  }

  if (!existing) {

    const { error } =
      await supabaseClient
        .from("user_question_progress")
        .insert({
          user_id: currentUser.id,
          question_id: questionId,
          attempts: 1,
          mistakes: isCorrect ? 0 : 1,
          consecutive_correct: isCorrect ? 1 : 0,
          mastered: false,
          last_attempt: new Date().toISOString()
        });

    if (error) {
      console.error("Progress insert error:", error);
    }

    return;
  }

  const newAttempts =
    existing.attempts + 1;

  const newMistakes =
    existing.mistakes + (isCorrect ? 0 : 1);

  const newConsecutive =
    isCorrect
      ? existing.consecutive_correct + 1
      : 0;

  const mastered =
    newConsecutive >= 5;

  const { error } =
    await supabaseClient
      .from("user_question_progress")
      .update({
        attempts: newAttempts,
        mistakes: newMistakes,
        consecutive_correct: newConsecutive,
        mastered: mastered,
        last_attempt: new Date().toISOString()
      })
      .eq("id", existing.id);

  if (error) {
    console.error("Progress update error:", error);
  }
}

// ---------------------------
// NEXT QUESTION
// ---------------------------

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion >= questions.length) {

    showResult();

  } else {

    showQuestion();
  }
}


// ---------------------------
// RESULT
// ---------------------------

function showResult() {

  document.getElementById("quiz")
    .classList.add("hidden");

  document.getElementById("result")
    .classList.remove("hidden");

  const percentage =
    Math.round(
      (score / questions.length) * 100
    );

  document.getElementById("score")
    .textContent =
    `${score}/${questions.length} (${percentage}%)`;

  let message;

  if (percentage >= 90) {
    message =
      "Excellent! You have a strong understanding of the Simple Present.";
  }
  else if (percentage >= 70) {
    message =
      "Good job! A little more practice will make you stronger.";
  }
  else if (percentage >= 50) {
    message =
      "You're getting there. Let's practice the difficult questions again.";
  }
  else {
    message =
      "Let's learn the rules and practice again.";
  }

  document.getElementById("resultMessage")
    .textContent = message;
}


// ---------------------------
// RESTART
// ---------------------------

function restartQuiz() {

  document.getElementById("result")
    .classList.add("hidden");

  document.getElementById("home")
    .classList.remove("hidden");

}


// ---------------------------
// SECURITY / DISPLAY HELPER
// ---------------------------

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}

</script>

</body>
</html>
